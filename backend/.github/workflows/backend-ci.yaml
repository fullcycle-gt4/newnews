name: Backend CI

on:
  push:
    # branches:
    #   - main

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      # 1. Baixa o código do repositório
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configura o ambiente Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Ajuste para a versão do Node que vocês usam
          cache: 'npm'       # Faz cache das dependências para acelerar o CI

      # 3. Instala as dependências (npm ci é mais rápido e seguro para CI)
      - name: Install dependencies
        run: npm ci

      # 4. Roda o linter (se houver o script configurado)
      - name: Run Linter
        run: npm run lint --if-present

      # 5. Roda o formater check (se houver, ex: Prettier)
      - name: Check Formatting
        run: npm run format:check --if-present

      # 6. Roda os testes unitários (Jest)
      - name: Run Tests
        run: npm test --if-present