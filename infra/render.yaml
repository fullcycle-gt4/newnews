services:
  - type: web
    name: frontend
    runtime: docker
    rootDir: ./frontend
    dockerfilePath: ./Dockerfile.prod
    plan: free
    autoDeployTrigger: "off"
    envVars:
      - key: PORT
        value: 8080
      - key: API_BASE_URL
        fromService:
          type: web
          name: backend
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: backend
    runtime: docker
    rootDir: ./backend
    dockerfilePath: ./Dockerfile.prod
    plan: free
    autoDeployTrigger: "off"
    envVars:
      - key: PORT
        value: 3000

      - key: DATABASE_URL
        value: file:./dev.db

      - key: USE_REDIS
        value: "false"

      - key: CURRENTS_API_KEY
        sync: false
