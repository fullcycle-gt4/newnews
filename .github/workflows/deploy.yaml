name: Deploy to Render

on:
  workflow_run:
    workflows: ["Frontend CI", "Backend CI"]
    types:
      - completed
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.name == 'Frontend CI') ||
      github.event_name == 'workflow_dispatch'
    steps:
      - name: Trigger Render Deploy Frontend
        run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.name == 'Backend CI') ||
      github.event_name == 'workflow_dispatch'
    steps:
      - name: Trigger Render Deploy Backend
        run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL_B }}"
